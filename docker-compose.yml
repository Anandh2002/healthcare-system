# docker-compose.yml
# Each "service" is a container. Docker pulls the image and runs it.
# "volumes" means data persists even if you stop the container.
# "ports" maps container port to your Windows port (host:container).

version: "3.9"

services:

  # PostgreSQL — our main database
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"      # Your Windows port 5432 → container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data survives restarts

  # Redis — for caching, token blacklist, and Celery broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO — S3-compatible local file storage
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Web console port
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: